# Nginx API Gateway Configuration for GOAL Project
server {
    listen 80;
    server_name _;

    # Client upload limit
    client_max_body_size 20M;

    # Logging
    access_log /var/log/nginx/goal_api_access.log;
    error_log /var/log/nginx/goal_api_error.log warn;

    # Reverse Proxy /api/ requests to Laravel running on Port 8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        # Pass real client headers to Laravel
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep-Alive & Auth headers
        proxy_http_version 1.1;
        proxy_pass_header Authorization;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
