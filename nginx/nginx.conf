map $http_origin $cors_origin {
    default "";
    # localhost semua port
    "~^http://(localhost|127\.0\.0\.1)(:\d+)?$"      $http_origin;
    # WSL2 / LAN IP range
    "~^http://172\.\d+\.\d+\.\d+(:\d+)?$"            $http_origin;
    "~^http://192\.168\.\d+\.\d+(:\d+)?$"            $http_origin;
    # Expo / ngrok / loca.lt tunnel
    "~^https?://.*\.ngrok(-free)?\.(app|io|dev)$"    $http_origin;
    "~^https?://.*\.loca\.lt(:\d+)?$"                $http_origin;
    "~^https?://.*\.exp\.direct(:\d+)?$"             $http_origin;
}

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Sembunyikan Nginx version ─────────────────────────────────────────────
    server_tokens off;

    # ── Client upload limit ───────────────────────────────────────────────────
    client_max_body_size 10M;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/goal-access.log;
    error_log /var/log/nginx/goal-error.log warn;

    # ── CORS Preflight (OPTIONS) ──────────────────────────────────────────────
    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'      "$cors_origin" always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Accept, X-Requested-With, ngrok-skip-browser-warning' always;
            add_header 'Access-Control-Allow-Credentials' 'false' always;
            add_header 'Access-Control-Max-Age'           86400 always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type'  'text/plain; charset=UTF-8';
            return 204;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Docker DNS Resolver & Upstream ─────────────────────────
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── PHP-FPM ───────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeout untuk long-running requests (booking creation dll.)
        fastcgi_read_timeout 90;
        fastcgi_send_timeout 90;

        # Suppress CORS headers dari Laravel agar tidak dobel dengan nginx
        fastcgi_hide_header 'Access-Control-Allow-Origin';
        fastcgi_hide_header 'Access-Control-Allow-Methods';
        fastcgi_hide_header 'Access-Control-Allow-Headers';
        fastcgi_hide_header 'Access-Control-Allow-Credentials';
        fastcgi_hide_header 'Access-Control-Max-Age';

        # CORS nginx — single source of truth, hanya untuk origin yang diizinkan
        add_header 'Access-Control-Allow-Origin'      "$cors_origin" always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization, Accept, X-Requested-With, ngrok-skip-browser-warning' always;
        add_header 'Access-Control-Allow-Credentials' 'false' always;
    }

    # ── Blokir akses ke file sensitif ────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~ ^/(\.env|composer\.(json|lock)|package\.json|artisan)$ {
        deny all;
        return 404;
    }

    # ── Static assets caching ────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Health check ─────────────────────────────────────────────────────────
    location = /api/health {
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }
}
