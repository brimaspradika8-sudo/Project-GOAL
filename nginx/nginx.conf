server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Sembunyikan Nginx version ─────────────────────────────────────────────
    server_tokens off;

    # ── Client upload limit (2MB untuk file upload) ───────────────────────────
    client_max_body_size 2M;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/goal-access.log;
    error_log /var/log/nginx/goal-error.log warn;

    # ── CORS Preflight (OPTIONS) — harus dihandle Nginx agar tidak 405 ───────
    location / {
        # Handle browser preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With, ngrok-skip-browser-warning' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeout untuk long-running requests (booking creation dll.)
        fastcgi_read_timeout 90;
        fastcgi_send_timeout 90;
    }

    # ── Blokir akses ke file sensitif ────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~ ^/(\.env|composer\.(json|lock)|package\.json|artisan)$ {
        deny all;
        return 404;
    }

    # ── Static assets caching ────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Health check (tidak di-log agar tidak memenuhi access log) ───────────
    location = /api/health {
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }
}
