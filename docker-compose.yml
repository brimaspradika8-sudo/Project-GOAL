services:
  # ── Nginx — reverse proxy untuk PHP-FPM ──────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: goal-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - goal-network

  # ── Laravel App (PHP-FPM) ─────────────────────────────────────────────────
  app:
    image: goal-app
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goal-backend
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/var/www/docker-entrypoint.sh"]
    volumes:
      - ./backend:/var/www
      - ./backend/.env.docker:/var/www/.env
    env_file:
      - ./backend/.env.docker
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - goal-network


  queue-worker:
    image: goal-app
    container_name: goal-queue-worker
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90 --backoff=3 --max-time=3600 --sleep=3
    environment:
      RUN_MIGRATIONS: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
    volumes:
      - ./backend:/var/www
      - ./backend/.env.docker:/var/www/.env
    env_file:
      - ./backend/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - goal-network

  # ── Laravel Scheduler ────────────────────────────────────────────────────
  scheduler:
    image: goal-app
    container_name: goal-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      RUN_MIGRATIONS: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
    volumes:
      - ./backend:/var/www
      - ./backend/.env.docker:/var/www/.env
    env_file:
      - ./backend/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - goal-network

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: goal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-project_goal}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: BRIMAS0501
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-project_goal}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - goal-network

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: goal-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - goal-network

volumes:
  postgres-data:
  redis-data:

networks:
  goal-network:
    driver: bridge
